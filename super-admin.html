<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Platform | TheMonishop</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://themonishop.com.ng/super-admin.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316432F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3ETM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#FBF8F1; --card:#FFFFFF; --ink:#17150F; --muted:#6F6A5E; --line:#E8E1D3;
  --green:#1F5A41; --green-d:#16432F; --gold:#A9772E; --red:#B23A33; --amber:#B5821A;
  --shadow:0 1px 2px rgba(23,21,15,.05),0 8px 24px -12px rgba(23,21,15,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,.brand{font-family:'Fraunces',serif}
a{color:var(--green)}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
.brand{font-weight:700;font-size:22px;display:flex;align-items:center;gap:9px;margin-bottom:24px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--green-d);display:grid;place-items:center;color:#fff;font-size:13px;font-family:'Hanken Grotesk'}
.authwrap{min-height:80vh;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px;margin-bottom:18px;max-width:440px}
.card.wide{max-width:none;overflow-x:auto}
.card h2{font-size:17px;margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#FCFAF5;color:var(--ink);font-family:inherit;font-size:15px}
.field input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,90,65,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;border:none;cursor:pointer;background:var(--green);color:#fff;font-family:inherit}
.btn:hover{background:var(--green-d)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.badge.ok{background:#E6F0E9;color:var(--green)} .badge.zero{background:#EFEBE0;color:var(--muted)}
.badge.gold{background:#F3E8D2;color:#8A5A12}
.summary{display:flex;gap:20px;margin-bottom:14px;flex-wrap:wrap}
.summary .n{font-family:'Fraunces';font-weight:600;font-size:22px}
.summary .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.empty{padding:16px;color:var(--muted);text-align:center}
.toggle{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);
  padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;max-width:90vw;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="authScreen" class="authwrap">
  <div class="card">
    <div class="brand"><span class="mark">TM</span> TheMonishop platform</div>
    <div class="field"><label>Email</label><input id="email" type="email" placeholder="you@email.com"></div>
    <div class="field"><label>Password</label><input id="pass" type="password" placeholder="Your password"></div>
    <button class="btn" id="signInBtn" onclick="doSignIn()" style="width:100%">Sign in</button>
  </div>
</div>

<div id="deniedScreen" class="authwrap hidden">
  <div class="card"><p class="hint">Signed in, but this account isn't a platform admin.</p><p class="hint" id="deniedDetail" style="margin-top:8px;color:var(--red)"></p></div>
</div>

<div id="dash" class="wrap hidden">
  <div class="brand"><span class="mark">TM</span> TheMonishop platform</div>

  <div class="card wide">
    <h2>Businesses</h2>
    <div id="bizTable"><div class="empty">Loading…</div></div>
  </div>

  <div class="card">
    <h2>Referral settings</h2>
    <div class="toggle"><input id="refEnabled" type="checkbox" style="width:auto"> <label for="refEnabled" style="font-weight:600">Referral program enabled</label></div>
    <div class="field"><label>Bonus amount (₦)</label><input id="refBonus" type="number" min="0" step="500"></div>
    <button class="btn" onclick="saveSettings()">Save</button>
  </div>

  <div class="card wide">
    <h2>Unpaid bonuses</h2>
    <div id="unpaidSummary" class="summary"></div>
    <div id="unpaidTable"><div class="empty">Loading…</div></div>
  </div>

  <div class="card wide">
    <h2>Paid bonuses</h2>
    <div id="paidTable"><div class="empty">Loading…</div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL      = "https://ifdmtxdazqzufbemciui.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZG10eGRhenF6dWZiZW1jaXVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDgzMzMsImV4cCI6MjA5NTgyNDMzM30.welfq6U39Kn9DXYbgrz4SR0-q9OyWSujwkI-8ZxTdFg";

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(Number(n||0));
const fmtD = t => new Date(t).toLocaleDateString('en-NG',{day:'2-digit',month:'short',year:'numeric'});
let toastT;
function toast(msg,isErr){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(isErr?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',3200); }

// this is a platform-wide admin tool, not the regular shop app — sessions
// are deliberately never persisted, so a password is required every time
// this page loads rather than silently staying signed in on a shared or
// unattended device
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:false}});

async function doSignIn(){
  const email=$('#email').value.trim(), pass=$('#pass').value;
  if(!email||!pass) return toast('Enter email and password',true);
  $('#signInBtn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ toast(error.message,true); $('#signInBtn').disabled=false; return; }
  afterSignIn();
}

async function afterSignIn(){
  const {data:bizData,error:bizErr} = await sb.rpc('platform_overview');
  if(bizErr){
    console.error('platform_overview error:', bizErr);
    $('#authScreen').classList.add('hidden');
    $('#deniedScreen').classList.remove('hidden');
    $('#deniedDetail').textContent = bizErr.message || '';
    return;
  }
  $('#authScreen').classList.add('hidden');
  $('#dash').classList.remove('hidden');
  renderBusinesses(bizData||[]);
  loadSettings();
  loadReferrals();
}

function renderBusinesses(rows){
  $('#bizTable').innerHTML = rows.length ? `<table><thead><tr>
    <th>Name</th><th>Admin</th><th>Plan</th><th>Created</th><th>Referral code</th><th>Members</th><th>Items</th>
  </tr></thead><tbody>${rows.map(b=>`<tr>
    <td>${esc(b.business_name)}</td>
    <td>${esc(b.admin_name||b.admin_email||'')}</td>
    <td><span class="badge ${b.is_paid?'ok':'zero'}">${b.is_paid?'Paid':'Free'}</span></td>
    <td>${fmtD(b.created_at)}</td>
    <td>${esc(b.referral_code||'')}</td>
    <td>${b.member_count}</td>
    <td>${b.item_count}</td>
  </tr>`).join('')}</tbody></table>` : '<div class="empty">No businesses yet.</div>';
}

async function loadSettings(){
  const {data,error}=await sb.from('referral_settings').select('*').eq('id',1).single();
  if(error) return;
  $('#refEnabled').checked=!!data.enabled;
  $('#refBonus').value=data.bonus_amount;
}
async function saveSettings(){
  const {error}=await sb.rpc('set_referral_settings',{p_enabled:$('#refEnabled').checked,p_bonus:+$('#refBonus').value||0});
  if(error) return toast(error.message,true);
  toast('Saved');
}

async function loadReferrals(){
  const {data,error}=await sb.rpc('platform_referrals');
  if(error){ toast(error.message,true); return; }
  const rows=data||[];
  const unpaid=rows.filter(r=>r.status==='bonus_eligible');
  const paid=rows.filter(r=>r.status==='bonus_paid');

  const unpaidTotal=unpaid.reduce((a,r)=>a+Number(r.bonus_amount||0),0);
  $('#unpaidSummary').innerHTML=`
    <div><div class="n">${unpaid.length}</div><div class="l">Unpaid referrals</div></div>
    <div><div class="n">${money(unpaidTotal)}</div><div class="l">Total owed</div></div>`;

  $('#unpaidTable').innerHTML = unpaid.length ? `<table><thead><tr>
    <th>Referrer</th><th>Referred</th><th>Amount</th><th>Pay to</th><th>Since</th><th></th>
  </tr></thead><tbody>${unpaid.map(r=>`<tr>
    <td>${esc(r.referrer_name)}</td><td>${esc(r.referred_name)}</td>
    <td><span class="badge gold">${money(r.bonus_amount)}</span></td>
    <td>${r.payout_account_number?`${esc(r.payout_bank_name||'')}<div class="hint">${esc(r.payout_account_number)} · ${esc(r.payout_account_name||'')}</div>`:'<span class="hint">not provided yet</span>'}</td>
    <td>${fmtD(r.created_at)}</td>
    <td><button class="btn ghost" onclick="markPaid('${r.id}')">Mark paid</button></td>
  </tr>`).join('')}</tbody></table>` : '<div class="empty">Nothing owed right now.</div>';

  $('#paidTable').innerHTML = paid.length ? `<table><thead><tr>
    <th>Referrer</th><th>Referred</th><th>Amount</th><th>Paid on</th>
  </tr></thead><tbody>${paid.map(r=>`<tr>
    <td>${esc(r.referrer_name)}</td><td>${esc(r.referred_name)}</td>
    <td>${money(r.bonus_amount)}</td><td>${fmtD(r.bonus_marked_at||r.created_at)}</td>
  </tr>`).join('')}</tbody></table>` : '<div class="empty">No payouts recorded yet.</div>';
}

async function markPaid(id){
  const {error}=await sb.rpc('mark_referral_bonus_paid',{p_id:id});
  if(error) return toast(error.message,true);
  toast('Marked paid');
  loadReferrals();
}
</script>
</body>
</html>
